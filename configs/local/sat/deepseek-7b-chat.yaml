model:
  name: deepseek-7b-chat
  model_id: deepseek-ai/deepseek-llm-7b-chat
  hidden_dim: 4096
  num_layers: 30
  eval_only: true

generation:
  num_runs: 5
  max_new_tokens: 16384
  temperature: 0.6
  top_p: 0.95
  seed: 42

paths:
  problems: data/datasets/selected_500_sat.parquet

  pipeline:
    cot_traces: ${IRT_OUTPUTS_ROOT}/local/sat/deepseek-7b-chat/cot_traces.jsonl

  analysis:
    cot_analysis: ${IRT_RESULTS_ROOT}/sat/deepseek-7b-chat/cot_analysis/cot_analysis.parquet
