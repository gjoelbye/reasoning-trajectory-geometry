model:
  name: qwq-32b
  model_id: Qwen/QwQ-32B
  hidden_dim: 5120
  num_layers: 64

generation:
  num_runs: 5
  max_new_tokens: 32768
  temperature: 0.6
  top_p: 0.95
  stride: 10
  seed: 42

paths:
  problems: data/datasets/selected_500_sat.parquet

  pipeline:
    cot_traces: ${IRT_OUTPUTS_ROOT}/pipeline/sat/qwq-32b/cot_traces.jsonl
    activations: ${IRT_OUTPUTS_ROOT}/pipeline/sat/qwq-32b/activations.h5

  analysis:
    cot_analysis: ${IRT_RESULTS_ROOT}/sat/qwq-32b/cot_analysis/cot_analysis.parquet
    trajectories: ${IRT_RESULTS_ROOT}/sat/qwq-32b/trajectories/trajectory_summaries.parquet
    probe_results: ${IRT_RESULTS_ROOT}/sat/qwq-32b/trajectories/probe_results_native.parquet
    trajectory_traces: ${IRT_RESULTS_ROOT}/sat/qwq-32b/trajectories/trajectory_traces.parquet
