model:
  name: gemma-9b
  model_id: google/gemma-2-9b-it
  hidden_dim: 3584
  num_layers: 42

generation:
  num_runs: 5
  max_new_tokens: 32768
  temperature: 0.6
  top_p: 0.95
  stride: 10
  seed: 42

paths:
  problems: data/datasets/selected_500.parquet

  pipeline:
    cot_traces: ${IRT_OUTPUTS_ROOT}/pipeline/code/gemma-9b/cot_traces.jsonl
    activations: ${IRT_OUTPUTS_ROOT}/pipeline/code/gemma-9b/activations.h5

  analysis:
    cot_analysis: ${IRT_RESULTS_ROOT}/code/gemma-9b/cot_analysis/cot_analysis.parquet
    trajectories: ${IRT_RESULTS_ROOT}/code/gemma-9b/trajectories/trajectory_summaries.parquet
    probe_results: ${IRT_RESULTS_ROOT}/code/gemma-9b/trajectories/probe_results_native.parquet
    trajectory_traces: ${IRT_RESULTS_ROOT}/code/gemma-9b/trajectories/trajectory_traces.parquet
