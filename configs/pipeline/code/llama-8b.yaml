model:
  name: llama-8b
  model_id: meta-llama/Llama-3.1-8B-Instruct
  hidden_dim: 4096
  num_layers: 32

generation:
  num_runs: 5
  max_new_tokens: 32768
  temperature: 0.6
  top_p: 0.95
  stride: 10
  seed: 42

paths:
  problems: data/datasets/selected_500.parquet

  pipeline:
    cot_traces: ${IRT_OUTPUTS_ROOT}/pipeline/code/llama-8b/cot_traces.jsonl
    activations: ${IRT_OUTPUTS_ROOT}/pipeline/code/llama-8b/activations.h5

  analysis:
    cot_analysis: ${IRT_RESULTS_ROOT}/code/llama-8b/cot_analysis/cot_analysis.parquet
    trajectories: ${IRT_RESULTS_ROOT}/code/llama-8b/trajectories/trajectory_summaries.parquet
    probe_results: ${IRT_RESULTS_ROOT}/code/llama-8b/trajectories/probe_results_native.parquet
    trajectory_traces: ${IRT_RESULTS_ROOT}/code/llama-8b/trajectories/trajectory_traces.parquet
