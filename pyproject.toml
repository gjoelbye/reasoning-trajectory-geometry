[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reasoning-trajectory-geometry"
version = "0.1.0"
description = "Code release for 'Reasoning Models Don't Just Think Longer, They Move Differently'."
requires-python = ">=3.10"
dependencies = [
    # Core ML / NLP
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "nnsight>=0.3.0",
    "accelerate>=0.27.0",
    "safetensors>=0.4.0",
    "sentencepiece>=0.2.0",
    # API model access (unified provider client used by run_api_generation)
    "litellm>=1.0",
    # Self-hosted judge models
    "vllm>=0.5.0",
    # Data
    "datasets>=2.18.0",
    "huggingface-hub>=0.21.0",
    "h5py>=3.10.0",
    "jsonlines>=4.0.0",
    "pyarrow>=14.0.0",
    # Scientific computing
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    # Visualization
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    # Notebook runtime
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    # NLP utilities (sentence segmentation for the LLM judge)
    "spacy>=3.7.0",
    "sympy>=1.12",
    # Config / progress
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
